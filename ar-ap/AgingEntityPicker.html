<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { font: 14px Arial, sans-serif; color: #202124; margin: 20px; }
      p { margin: 0 0 14px; color: #5f6368; }
      #entities { border: 1px solid #dadce0; border-radius: 8px; height: 278px; overflow-y: auto; padding: 6px 12px; }
      label { display: flex; align-items: center; gap: 10px; min-height: 34px; cursor: pointer; }
      label + label { border-top: 1px solid #f1f3f4; }
      input[type="checkbox"] { width: 17px; height: 17px; accent-color: #1a73e8; }
      .toolbar { display: flex; gap: 12px; margin: 12px 0 16px; }
      .toolbar button { border: 0; background: none; color: #1a73e8; padding: 0; cursor: pointer; }
      .toolbar button:disabled { color: #9aa0a6; cursor: default; }
      .actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
      .actions button { border: 0; border-radius: 4px; padding: 9px 14px; cursor: pointer; }
      #close { background: #f1f3f4; color: #3c4043; }
      #submit { background: #1a73e8; color: white; }
      #submit:disabled { background: #dadce0; color: #5f6368; cursor: default; }
      #status { min-height: 35px; margin-bottom: 10px; line-height: 1.4; }
      #status.error { color: #b3261e; }
      #status.success { color: #137333; }
    </style>
  </head>
  <body>
    <p>Choose the entities you want to update.</p>
    <div id="entities" aria-label="Available entities">Loading entities...</div>
    <div class="toolbar">
      <button id="selectAll" type="button" disabled>Select all</button>
      <button id="clear" type="button" disabled>Clear</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="actions">
      <button id="close" type="button">Close</button>
      <button id="submit" type="button" disabled>Update selected</button>
    </div>
    <script>
      const list = document.getElementById('entities');
      const submit = document.getElementById('submit');
      const status = document.getElementById('status');
      const selectAll = document.getElementById('selectAll');
      const clear = document.getElementById('clear');
      let running = false;
      let completed = false;

      function selectedEntities() {
        return Array.from(list.querySelectorAll('input[type="checkbox"]:checked'))
          .map(input => input.value);
      }

      function updateControls() {
        const count = selectedEntities().length;
        submit.disabled = running || completed || count === 0;
        submit.textContent = count ? `Update selected (${count})` : 'Update selected';
        selectAll.disabled = running || !list.querySelector('input[type="checkbox"]');
        clear.disabled = running || count === 0;
      }

      function showStatus(message, type) {
        status.textContent = message;
        status.className = type || '';
      }

      function renderEntities(aliases) {
        list.replaceChildren();
        if (!aliases.length) {
          list.textContent = 'No active entities are available.';
          return;
        }
        aliases.forEach(alias => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          const name = document.createElement('span');
          input.type = 'checkbox';
          input.value = alias;
          name.textContent = alias;
          label.append(input, name);
          list.append(label);
        });
        updateControls();
      }

      list.addEventListener('change', () => {
        completed = false;
        showStatus('');
        updateControls();
      });
      selectAll.addEventListener('click', () => {
        list.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = true; });
        completed = false;
        showStatus('');
        updateControls();
      });
      clear.addEventListener('click', () => {
        list.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = false; });
        completed = false;
        showStatus('');
        updateControls();
      });
      document.getElementById('close').addEventListener('click', () => google.script.host.close());
      submit.addEventListener('click', () => {
        const aliases = selectedEntities();
        if (!aliases.length || running) return;
        running = true;
        showStatus(`Updating ${aliases.length} ${aliases.length === 1 ? 'entity' : 'entities'}...`);
        updateControls();
        google.script.run
          .withSuccessHandler(result => {
            running = false;
            completed = result.status === 'passed' || result.status === 'completed_with_warnings';
            if (result.status === 'passed') {
              showStatus(`Updated ${result.outputSheetCount} ${result.outputSheetCount === 1 ? 'entity' : 'entities'}.`, 'success');
            } else if (result.status === 'completed_with_warnings') {
              const details = result.sheets.filter(sheet => sheet.status !== 'updated')
                .map(sheet => `${sheet.sheetName}: ${sheet.status}`).join('; ');
              showStatus(`Finished with warnings. ${details}`, 'error');
            } else {
              showStatus(`No update was completed: ${result.status}.`, 'error');
            }
            updateControls();
          })
          .withFailureHandler(error => {
            running = false;
            showStatus(error.message || String(error), 'error');
            updateControls();
          })
          .runSelectedAgingExport(aliases);
      });

      google.script.run
        .withSuccessHandler(renderEntities)
        .withFailureHandler(error => {
          list.textContent = 'Unable to load entities.';
          showStatus(error.message || String(error), 'error');
        })
        .getAgingEntityPickerOptions();
    </script>
  </body>
</html>
